name: Go Lint

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go 1.23.11
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.11

      - name: Install golangci-lint v1.60.0
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.60.0
          args: "--timeout=5m"

      - name: Run golangci-lint
        run: golangci-lint run ./...