name: Build

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: centos-7
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23.11'
      - name: Build
        run: |
          go build -v ./... 