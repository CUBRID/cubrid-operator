# PersistentVolumes for Static Provisioning
# These PVs must be created before applying the static provisioning CubridDB
# 
# Usage:
# 1. kubectl apply -f pvs-for-static-provisioning.yaml
# 2. kubectl apply -f cubrid_static_provisioning.yaml

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cubrid-database-pv-0
  labels:
    type: cubrid-database
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /data/cubrid/database-0
---
