---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: cubrid-mutating-webhook
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: cubrid-webhook-service
      namespace: cubrid
      path: /mutate-k8s-cubrid-com-v1-backupdb
    caBundle: 
  failurePolicy: Fail
  name: mbackupdb.kb.io
  rules:
  - apiGroups:
    - k8s.cubrid.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backupdbs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: cubrid-webhook-service
      namespace: cubrid
      path: /mutate-k8s-cubrid-com-v1-cubriddb
    #url: https://localhost:9443/mutate-k8s-cubrid-com-v1-cubriddb
    caBundle: 
  failurePolicy: Fail
  name: mcubriddb.kb.io
  rules:
  - apiGroups:
    - k8s.cubrid.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cubriddbs
  sideEffects: None
