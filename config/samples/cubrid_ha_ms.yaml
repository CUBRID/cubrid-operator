apiVersion: k8s.cubrid.com/v1
kind: CubridDB
metadata:
  name: ha-ms

spec:
  image: airnet73/cubrid:v11.3.2.1187
  updateStrategy:
    type: "RollingUpdate" 
    rollingUpdate:
      partition: 0        
      maxUnavailable: 3
  replication:
    enable: true
    replicas: 2
    hamodeType:
      type: "master-slave"
 
  broker:
  - name: ms-broker1-svc
    port: 30000
    servicePort: 30100
    serviceType: NodePort
  - name: ms-broker2-svc
    port: 33000
    servicePort: 30101
    serviceType: NodePort
