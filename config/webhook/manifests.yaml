---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-k8s-cubrid-com-v1-backupdb
  failurePolicy: Fail
  name: mbackupdb.kb.io
  rules:
  - apiGroups:
    - k8s.cubrid.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backupdbs
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-k8s-cubrid-com-v1-backupdb
  failurePolicy: Fail
  name: vbackupdb.kb.io
  rules:
  - apiGroups:
    - k8s.cubrid.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - backupdbs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-k8s-cubrid-com-v1-cubriddb
  failurePolicy: Fail
  name: vcubriddb.kb.io
  rules:
  - apiGroups:
    - k8s.cubrid.com
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - cubriddbs
  sideEffects: None
