{{ if and (not .Values.currentNamespaceOnly) .Values.webhook.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name:  {{ include "cubrid-operator-webhook.clusterRoleName" . }}
rules:
- apiGroups:
  - k8s.cubrid.com
  resources:
  - backupdbs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.cubrid.com
  resources:
  - backupdbs/finalizers
  verbs:
  - update
- apiGroups:
  - k8s.cubrid.com
  resources:
  - backupdbs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - k8s.cubrid.com
  resources:
  - cubriddbs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - k8s.cubrid.com
  resources:
  - cubriddbs/finalizers
  verbs:
  - update
- apiGroups:
  - k8s.cubrid.com
  resources:
  - cubriddbs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch  
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - update
  - patch
- apiGroups:
  - admissionregistration.k8s.io
  resources:
  - mutatingwebhookconfigurations
  - validatingwebhookconfigurations
  verbs:
  - get
  - update
  - patch
  - list
  - watch
{{- end }}