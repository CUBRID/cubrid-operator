# permissions for end users to view backupdbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: clusterrole
    app.kubernetes.io/instance: backupdb-viewer-role
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: cubrid-operator
    app.kubernetes.io/part-of: cubrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: {{ include "cubrid-operator.backupdbViewClusterRoleName" . }}
rules:
- apiGroups:
  - k8s.cubrid.com
  resources:
  - backupdbs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - k8s.cubrid.com
  resources:
  - backupdbs/status
  verbs:
  - get
