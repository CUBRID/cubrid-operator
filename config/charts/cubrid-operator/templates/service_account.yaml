{{- if .Values.operator.serviceAccount.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: cubrid-operator
    app.kubernetes.io/managed-by: kustomize
  name: {{ include "cubrid-operator.serviceAccountName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
{{- end -}}