# Default values for cubrid-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: airnet73/operator
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace: "cubrid"


# -- Whether the operator should watch CRDs only in its own namespace or not.
currentNamespaceOnly: false


# cubrid operator 
operator:
  enabled: true
  serviceAccount:
    enabled: true
    name: ""
  clusterRoleName:
    name: ""
  clusterRoleBindingName:
    name: ""
  electionRoleName:
    name: ""
  electionRoleBindingName:
    name: ""
  cubriddbEditClusterRoleName: 
    name: ""
  cubriddbViewClusterRoleName: 
    name: ""
  backupdbEditClusterRoleName:
    name: ""
  backupdbViewClusterRoleName:
    name: ""
  





# Webhook Configurations
webhook:
  # -- Specifies whether the webhook should be created.
  enabled: true
  cabundle: ""
  mutating:
    name: cubrid-mutating-webhook
    namespaceSelector: {}
    objectSelector: {}
  validating:
    name: cubrid-validating-webhook
    namespaceSelector: {}
    objectSelector: {}
  brules:
  - apiGroups:
      - k8s.cubrid.com
    apiVersions:
      - v1
    operations:
      - CREATE
      - UPDATE
    resources:
      - backupdbs
  crules:
  - apiGroups:
      - k8s.cubrid.com
    apiVersions:
      - v1
    operations:
      - CREATE
      - UPDATE
    resources:
      - cubriddbs
  secret:
    tls:
      crt: ""
      key: ""
      
  # -- Annotations to add to webhook Pod
  podAnnotations: {}

  serviceAccount:
    name: ""

  clusterRoleName:
    name: ""

  clusterRoleBindingName:
    name: ""    

  secretName:
    name: ""
  
  serviceName:
    name: ""