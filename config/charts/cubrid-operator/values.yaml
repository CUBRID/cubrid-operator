# Default values for cubrid-operator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: airnet73/operator

  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  pullPolicy: IfNotPresent


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

namespace: "cubrid"


# -- Whether the operator should watch CRDs only in its own namespace or not.
currentNamespaceOnly: false


# cubrid operator 
operator:
  enabled: true
  serviceAccount:
    enabled: true
    name: ""
  clusterRoleName:
    name: ""
  clusterRoleBindingName:
    name: ""
  electionRoleName:
    name: ""
  electionRoleBindingName:
    name: ""
  cubriddbEditClusterRoleName: 
    name: ""
  cubriddbViewClusterRoleName: 
    name: ""
  backupdbEditClusterRoleName:
    name: ""
  backupdbViewClusterRoleName:
    name: ""
  
  ports:
    probe: 8081




# Webhook Configurations
webhook:
  # -- Specifies whether the webhook should be created.
  enabled: true
  namespace: ""
  certDir: /tmp/k8s-webhook-server/serving-certs
  secretName: cubrid-operator-webhook-cert
  certManagerType: internal  
  podAnnotations: {}  
  ports:
    webhook: 8443
    metrics: 8082
    probe: 8083
  
  # webhook rules for backupdb
  brules:
    - apiGroups:
        - k8s.cubrid.com
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - backupdbs
  
  # webhook rules for cubriddb
  crules:
    - apiGroups:
        - k8s.cubrid.com
      apiVersions:
        - v1
      operations:
        - CREATE
        - UPDATE
      resources:
        - cubriddbs

  # Pod
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # Probe
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8083
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8083
      scheme: HTTP
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # Webhook
  failurePolicy: Fail
  timeoutSeconds: 5

  serviceAccount:
    name: ""

  clusterRoleName:
    name: ""

  clusterRoleBindingName:
    name: ""    

  serviceName:
    name: ""

# Ingress configuration
ingress:
  # Enable ingress check for nginx ingress controller
  enabled: true
